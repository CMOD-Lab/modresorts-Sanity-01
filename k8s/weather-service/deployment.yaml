# Weather Service – Kubernetes Deployment for Amazon EKS
# cz-java-0082: Independently deployable Deployment manifest for the
# WeatherServlet microservice.
#
# This Deployment:
#   - Runs the weather-service container image independently of other services
#   - Injects all configuration via the weather-service-config ConfigMap and
#     the weather-service-secrets Secret (WEATHER_API_KEY)
#   - Configures liveness and readiness probes against the /health endpoint
#   - Applies resource requests/limits suitable for EKS node sizing
#
# Usage:
#   kubectl apply -f k8s/weather-service/deployment.yaml
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-service
  namespace: modresorts
  labels:
    app: weather-service
    component: modresorts
    managed-by: eks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-service
  template:
    metadata:
      labels:
        app: weather-service
        component: modresorts
    spec:
      containers:
        - name: weather-service
          # Replace <ECR_REGISTRY> and <IMAGE_TAG> with your ECR repository URI and tag.
          image: ${ECR_REGISTRY}/modresorts/weather-service:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9080
              protocol: TCP
          env:
            # Non-sensitive configuration from ConfigMap
            - name: SERVICE_DISCOVERY_URL
              valueFrom:
                configMapKeyRef:
                  name: weather-service-config
                  key: SERVICE_DISCOVERY_URL
            - name: CUSTOMER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: weather-service-config
                  key: CUSTOMER_SERVICE_URL
            # Sensitive configuration from Secret
            - name: WEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weather-service-secrets
                  key: WEATHER_API_KEY
          # Liveness probe – restarts the pod if the application is unresponsive
          livenessProbe:
            httpGet:
              path: /health
              port: 9080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          # Readiness probe – removes the pod from the Service endpoints until ready
          readinessProbe:
            httpGet:
              path: /health
              port: 9080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      # Ensure pods are spread across availability zones for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: weather-service
