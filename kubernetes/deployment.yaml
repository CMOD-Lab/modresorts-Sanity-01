apiVersion: apps/v1
kind: Deployment
metadata:
  name: modresorts
  namespace: modresorts
  labels:
    app: modresorts
    version: "2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modresorts
  template:
    metadata:
      labels:
        app: modresorts
        version: "2.0.0"
    spec:
      containers:
        - name: modresorts
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9080
              protocol: TCP
          env:
            # JVM tuning
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
            - name: TZ
              value: "UTC"
            # Weather Underground API key
            - name: WEATHER_API_KEY
              value: "{{WEATHER_API_KEY}}"
            # Amazon ElastiCache (Redis) connection
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            # Customer info microservice endpoint (Kubernetes DNS)
            - name: CUSTOMER_INFO_SERVICE_URL
              value: "{{CUSTOMER_INFO_SERVICE_URL}}"
            # REST-based service discovery endpoint (Kubernetes DNS)
            - name: SERVICE_DISCOVERY_URL
              value: "{{SERVICE_DISCOVERY_URL}}"
            # Server identity (replaces WebSphere ServerName)
            - name: SERVER_DISPLAY_NAME
              value: "modresorts"
            - name: SERVER_FULL_NAME
              value: "modresorts"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 9080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: logs-volume
              mountPath: /opt/tomcat/logs
      volumes:
        - name: logs-volume
          emptyDir: {}
      terminationGracePeriodSeconds: 30
