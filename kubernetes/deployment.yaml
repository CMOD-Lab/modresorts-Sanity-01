apiVersion: apps/v1
kind: Deployment
metadata:
  name: modresorts
  namespace: modresorts
  labels:
    app: modresorts
    version: "2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modresorts
  template:
    metadata:
      labels:
        app: modresorts
        version: "2.0.0"
    spec:
      containers:
        - name: modresorts
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9080
              protocol: TCP
          env:
            # Weather service configuration
            - name: WEATHER_API_KEY
              value: "{{WEATHER_API_KEY}}"
            - name: WEATHER_SERVICE_BASE_URL
              value: "{{WEATHER_SERVICE_BASE_URL}}"
            # Redis / ElastiCache configuration
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            # Naming service (REST-based service discovery)
            - name: NAMING_SERVICE_HOST
              value: "{{NAMING_SERVICE_HOST}}"
            - name: NAMING_SERVICE_PORT
              value: "{{NAMING_SERVICE_PORT}}"
            # Server identity
            - name: SERVER_DISPLAY_NAME
              value: "modresorts"
            - name: SERVER_FULL_NAME
              value: "modresorts-server"
            # JVM options
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Duser.timezone=UTC"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /resorts/health
              port: 9080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /resorts/health
              port: 9080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
